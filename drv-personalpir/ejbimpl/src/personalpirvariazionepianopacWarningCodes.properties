00001=E' stata selezionata come modalità di alimentazione del Piano dei Premi Programmati l'opzione 'Disposizione Permanente SDD su Banca Esterna', la sottoscrizione tramite Firma Digitale e Copernico non è consentita.
00002=E' stata selezionata l'opzione 'Conto corrente in apertura', la sottoscrizione tramite Firma Digitale e Copernico non è consentita.
00003=L'assicurando risulta minorenne; la sottoscrizione tramite firma digitale e Copernico non è consentita.
00004=Il contraente è una persona giuridica, la sottoscrizione tramite Firma Digitale e Copernico non è consentita.
00005=Ricordare al cliente che la richiesta di sospensione deve essere inoltratta alla banca di provenienza del cc d'appoggio.
00006=Il contraente non è intestatario o cointestatario del conto di addebito indicato, la sottoscrizione tramite Firma Digitale e Copernico non è consentita.
00007=Non è possibile utilizzare un conto corrente di cui l'intestatario del prodotto sia unicamente delegato. Per proseguire è quindi necessario selezionare un conto corrente nel quale vi sia coincidenza tra intestatario/cointestatario del prodotto e del conto corrente. In presenza di specifiche esigenze è possibile proseguire con l'operazione richiesta unicamente in firma olografa, previa compilazione dell'apposita modulistica 'Manleva Delegato' da inviare allegata alla disposizione, che sarà valutata discrezionalmente dalla Società.
00008=Il contraente risulta minorenne; la sottoscrizione tramite firma digitale e Copernico non è consentita. Ricordati di allegare il decreto del giudice tutelare.
00009=Il campo riferito alla relazione tra contraente e terzo pagatore è valorizzato con la relazione '4 - altro'. Ricordati di allegare il modulo AV Operazione.